spring.application.name=hirely

# Datasource Configuration (Defaults to H2 in-memory DB for instant execution; override via DB_URL env var for MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:hirelydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:hirelysupersecretjwtkeyforlocaldevelopment1234567890}
jwt.expiration=86400000

app.otp.expiration-minutes=5
app.otp.resend-cooldown-seconds=60
app.otp.max-attempts=5